<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Citas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
      color: white;
      padding: 30px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .header-logo {
      max-width: 400px;
      width: 100%;
      height: auto;
      margin-bottom: 15px;
    }

    .header h1 {
      font-size: 24px;
      margin: 0;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .content {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .required::after {
      content: " *";
      color: #e74c3c;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #003d7a;
      box-shadow: 0 0 0 3px rgba(0, 61, 122, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #003d7a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: #002a54;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 61, 122, 0.4);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .hidden {
      display: none;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .radio-option input[type="radio"] {
      width: auto;
      margin: 0;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .time-slot {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
    }

    .time-slot:hover {
      border-color: #003d7a;
      background: #e6f0ff;
    }

    .time-slot.selected {
      background: #003d7a;
      color: white;
      border-color: #003d7a;
    }

    .time-slot.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: #f5f5f5;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
    }

    .success-message {
      text-align: center;
      padding: 40px 20px;
    }

    .success-icon {
      font-size: 60px;
      color: #27ae60;
      margin-bottom: 20px;
    }

    .success-message h2 {
      color: #27ae60;
      margin-bottom: 10px;
    }

    .success-message p {
      color: #666;
      line-height: 1.6;
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #003d7a;
    }

    .step-indicator {
      text-align: center;
      padding: 15px;
      background: #f8f9fa;
      color: #666;
      font-size: 13px;
      border-bottom: 1px solid #e0e0e0;
    }
  </style>
</head>

  <script>
    // Variables globales
    let userData = {};
    let bookedSlots = [];

    // Generar slots de tiempo
    function generateTimeSlots() {
      const grid = document.getElementById('timeGrid');
      grid.innerHTML = '';
      
      const startHour = 8;
      const endHour = 17;
      
      for (let hour = startHour; hour < endHour; hour++) {
        for (let minute = 0; minute < 60; minute += 30) {
          const timeString = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
          const displayTime = `${hour > 12 ? hour - 12 : hour}:${minute.toString().padStart(2, '0')} ${hour >= 12 ? 'PM' : 'AM'}`;
          
          const slot = document.createElement('div');
          slot.className = 'time-slot';
          slot.textContent = displayTime;
          slot.dataset.time = timeString;
          slot.onclick = () => selectTimeSlot(slot);
          
          grid.appendChild(slot);
        }
      }
    }

    // Seleccionar slot de tiempo
    function selectTimeSlot(slot) {
      if (slot.classList.contains('disabled')) return;
      
      document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
      slot.classList.add('selected');
      document.getElementById('horaCita').value = slot.dataset.time;
    }

    // Configurar fecha mínima y deshabilitar fines de semana
    function setupDatePicker() {
      const fechaInput = document.getElementById('fechaCita');
      const sedeSelect = document.getElementById('sede');
      const dateError = document.getElementById('dateError');
      const today = new Date();
      today.setDate(today.getDate() + 1); // Mínimo mañana
      fechaInput.min = today.toISOString().split('T')[0];
      
      fechaInput.addEventListener('change', function() {
        const selectedDate = new Date(this.value + 'T00:00:00');
        const dayOfWeek = selectedDate.getDay();
        
        dateError.classList.add('hidden');
        
        if (dayOfWeek === 0 || dayOfWeek === 6) {
          dateError.textContent = 'No se pueden agendar citas los fines de semana. Por favor selecciona un día entre lunes y viernes.';
          dateError.classList.remove('hidden');
          this.value = '';
          // Limpiar slots de tiempo
          document.querySelectorAll('.time-slot').forEach(slot => {
            slot.classList.remove('selected', 'disabled');
          });
          document.getElementById('horaCita').value = '';
          return;
        }
        
        // Cargar las horas ocupadas para esa fecha
        loadBookedSlots(this.value);
      });
      
      // También recargar cuando cambie la sede
      sedeSelect.addEventListener('change', function() {
        const fecha = fechaInput.value;
        if (fecha) {
          loadBookedSlots(fecha);
        }
      });
    }

    // Cargar slots ocupados (se debe implementar en el backend)
    function loadBookedSlots(date) {
      const sede = document.getElementById('sede').value;
      
      if (!sede) {
        // Si no hay sede seleccionada, no cargar slots
        return;
      }
      
      google.script.run
        .withSuccessHandler(function(slots) {
          bookedSlots = slots || [];
          updateTimeSlots();
        })
        .withFailureHandler(function(error) {
          console.error('Error loading booked slots:', error);
          bookedSlots = [];
          updateTimeSlots();
        })
        .getBookedSlots(date, sede);
    }

    // Actualizar disponibilidad de slots
    function updateTimeSlots() {
      document.querySelectorAll('.time-slot').forEach(slot => {
        const time = slot.dataset.time;
        if (bookedSlots.includes(time)) {
          slot.classList.add('disabled');
        } else {
          slot.classList.remove('disabled');
        }
      });
    }

    // Manejo del tipo de reunión
    document.querySelectorAll('input[name="tipoReunion"]').forEach(radio => {
      radio.addEventListener('change', function() {
        const presencialesGroup = document.getElementById('participantesPresencialesGroup');
        const virtualesGroup = document.getElementById('participantesVirtualesGroup');
        
        if (this.value === 'Presencial') {
          presencialesGroup.classList.remove('hidden');
          virtualesGroup.classList.add('hidden');
          document.getElementById('participantesVirtuales').value = '';
        } else {
          virtualesGroup.classList.remove('hidden');
          presencialesGroup.classList.add('hidden');
          document.getElementById('participantesPresenciales').value = '';
        }
      });
    });

    // Paso 1: Submit
    document.getElementById('step1').addEventListener('submit', function(e) {
      e.preventDefault();
      
      userData = {
        nombreCompleto: document.getElementById('nombreCompleto').value,
        correo: document.getElementById('correo').value,
        tipoDocumento: document.getElementById('tipoDocumento1').value,
        numeroDocumento: document.getElementById('numeroDocumento1').value,
        telefono: document.getElementById('telefono').value
      };
      
      // Llenar datos en paso 2
      document.getElementById('tipoDocumento2').value = userData.tipoDocumento;
      document.getElementById('numeroDocumento2').value = userData.numeroDocumento;
      
      // Cambiar a paso 2
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      document.getElementById('headerTitle').textContent = 'Agenda tu Cita';
      document.getElementById('stepIndicator').textContent = 'Paso 2 de 2';
    });

    // Volver al paso 1
    function goBack() {
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('headerTitle').textContent = 'Superintendencia de Regulación Sanitaria';
      document.getElementById('stepIndicator').textContent = 'Paso 1 de 2';
    }

    // Paso 2: Submit
    document.getElementById('step2').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.classList.add('hidden');
      
      // Validar hora seleccionada
      if (!document.getElementById('horaCita').value) {
        errorDiv.textContent = 'Por favor selecciona una hora para tu cita';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      const citaData = {
        ...userData,
        sede: document.getElementById('sede').value,
        area: document.getElementById('area').value,
        numeroPresentacion: document.getElementById('numeroPresentacion').value,
        descripcion: document.getElementById('descripcion').value,
        tipoReunion: document.querySelector('input[name="tipoReunion"]:checked').value,
        participantes: document.querySelector('input[name="tipoReunion"]:checked').value === 'Presencial' 
          ? document.getElementById('participantesPresenciales').value 
          : document.getElementById('participantesVirtuales').value,
        fechaCita: document.getElementById('fechaCita').value,
        horaCita: document.getElementById('horaCita').value,
        timestamp: new Date().toISOString()
      };
      
      // Mostrar pantalla de carga
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('loadingScreen').classList.remove('hidden');
      
      // Enviar datos al backend
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .saveCita(citaData);
    });

    function onSuccess(result) {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('successScreen').classList.remove('hidden');
    }

    function onFailure(error) {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = 'Error al guardar la cita: ' + error.message;
      errorDiv.classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('step1').reset();
      document.getElementById('step2').reset();
      document.getElementById('successScreen').classList.add('hidden');
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('headerTitle').textContent = 'Superintendencia de Regulación Sanitaria';
      document.getElementById('stepIndicator').textContent = 'Paso 1 de 2';
      userData = {};
    }

    // Inicialización
    generateTimeSlots();
    setupDatePicker();
  </script>
</body>
</html>
